name: Build Signed AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-24.04

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/cg-gs-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/cg-gs-upload-key.jks"

      - name: Verify signing keystore
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/cg-gs-upload-key.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/cg-gs-upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "cg-gs-upload" > /dev/null

          echo "Keystore verification successful."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed release AAB
        shell: bash
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/cg-gs-upload-key.jks"
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cg-gs-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
